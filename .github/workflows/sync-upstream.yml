name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge upstream when conflict-free
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mesamirh/MovieBox-Tui.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already current with upstream/main."
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "Upstream changes conflict with fork changes. No changes were pushed; resolve manually."
            exit 1
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
